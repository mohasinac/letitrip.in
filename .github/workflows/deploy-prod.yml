name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Quality Gate + Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install consumer dependencies
        run: npm ci

      - name: Install appkit dev dependencies
        run: npm --prefix appkit install --legacy-peer-deps

      - name: Build appkit
        run: npm --prefix appkit run build

      # `npm run check` is the sole pre-deploy gate: tsc in both repos, ~60
      # audits, then eslint. The "Run tests" step that used to follow it is
      # gone along with vitest — the suite was 352-red and ungated, and its
      # mocks asserted against behaviour the code did not have, so a green run
      # was not evidence of anything.
      #
      # The gate that actually catches a production outage is the post-deploy
      # smoke test inside scripts/deploy.mjs (Root Cause #69: a build Vercel
      # reported READY served 500 on every route). Deployment here goes
      # through `vercel --prod` directly, so that smoke test does NOT run in
      # this workflow — prefer `node scripts/deploy.mjs` locally.
      - name: Run quality gate
        run: npm run check

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel --prod --token "$VERCEL_TOKEN" --yes

      - name: Summary
        run: |
          echo "### Production Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "Quality gate passed. Deployed to \`https://letitrip.in\`." >> $GITHUB_STEP_SUMMARY
