name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install consumer dependencies
        run: npm ci

      - name: Install appkit dev dependencies
        run: npm --prefix appkit install --legacy-peer-deps

      - name: Build appkit
        run: npm --prefix appkit run build

      - name: Type check — appkit
        run: npm run check:types:appkit

      - name: Type check — consumer
        run: npm run check:types:app

      - name: audit-violations
        working-directory: appkit
        run: node scripts/audit-violations.mjs
      - name: verify-entries
        working-directory: appkit
        run: node scripts/verify-entries.mjs
      - name: verify-css-build
        working-directory: appkit
        run: node scripts/verify-css-build.mjs
      - name: audit-use-client
        working-directory: appkit
        run: node scripts/audit-use-client.mjs
      - name: audit-double-navigation
        working-directory: appkit
        run: node scripts/audit-double-navigation.mjs
      - name: audit-repository-fields
        working-directory: appkit
        run: node scripts/audit-repository-fields.mjs
      - name: audit-query-provider
        working-directory: appkit
        run: node scripts/audit-query-provider.mjs
      - name: audit-export-paths
        working-directory: appkit
        run: node scripts/audit-export-paths.mjs
      - name: audit-listing-indices
        working-directory: appkit
        run: node scripts/audit-listing-indices.mjs
      - name: audit-listing-type-reads
        working-directory: appkit
        run: node scripts/audit-listing-type-reads.mjs
      - name: audit-create-with-id
        working-directory: appkit
        run: node scripts/audit-create-with-id.mjs
      - name: audit-css-imports
        working-directory: appkit
        run: node scripts/audit-css-imports.mjs
      - name: audit-appkit-reexports
        working-directory: appkit
        run: node scripts/audit-appkit-reexports.mjs
      - name: audit-action-confirmation
        working-directory: appkit
        run: node scripts/audit-action-confirmation.mjs
      - name: audit-route-strings
        working-directory: appkit
        run: node scripts/audit-route-strings.mjs
      - name: audit-paginated-select
        working-directory: appkit
        run: node scripts/audit-paginated-select.mjs
      - name: audit-sieve-constants-views
        working-directory: appkit
        run: node scripts/audit-sieve-constants-views.mjs
      - name: audit-schema-registry-completeness
        working-directory: appkit
        run: node scripts/audit-schema-registry-completeness.mjs
      - name: audit-firestore-schema-coverage
        working-directory: appkit
        run: node scripts/audit-firestore-schema-coverage.mjs
      - name: audit-catch-normalize
        working-directory: appkit
        run: node scripts/audit-catch-normalize.mjs
      - name: audit-route-schema-registry
        working-directory: appkit
        run: node scripts/audit-route-schema-registry.mjs
      - name: audit-z-any-z-unknown
        working-directory: appkit
        run: node scripts/audit-z-any-z-unknown.mjs

      - name: Consumer audits
        run: node scripts/run-audits.mjs --all --no-fail-fast 2>&1

      - name: Lint
        run: npm run check:lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install consumer dependencies
        run: npm ci

      - name: Install appkit dev dependencies
        run: npm --prefix appkit install --legacy-peer-deps

      - name: Build appkit
        run: npm --prefix appkit run build

      - name: Run consumer tests
        run: npm run test -- --run

      - name: Run appkit tests
        run: npm --prefix appkit run test -- --run
