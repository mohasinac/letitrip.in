name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install appkit dev dependencies
        run: npm --prefix appkit install --legacy-peer-deps

      - name: Type check — appkit
        run: npm run check:types:appkit

      - name: Type check — consumer
        run: npm run check:types:app

      - name: Audits
        run: npm run check:audits

      - name: Lint
        run: npm run check:lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install appkit dev dependencies
        run: npm --prefix appkit install --legacy-peer-deps

      - name: Run consumer tests
        run: npm run test -- --run

      - name: Run appkit tests
        run: npm --prefix appkit run test -- --run
