name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          NPM_TOKEN_AUTO: ${{ secrets.NPM_TOKEN_AUTO || '' }}

      - name: Build appkit
        run: npm --prefix appkit run build

      - name: Run quality gate
        run: npm run check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          NPM_TOKEN_AUTO: ${{ secrets.NPM_TOKEN_AUTO || '' }}

      - name: Build appkit
        run: npm --prefix appkit run build

      - name: Run consumer tests
        run: npm run test -- --run

      - name: Run appkit tests
        run: npm --prefix appkit run test -- --run
